<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --sidebar: #161b22;
      --surface: #21262d;
      --surface2: #2d333b;
      --border: #30363d;
      --text: #e6edf3;
      --dim: #8b949e;
      --accent: #7c3aed;
      --accent-h: #6d28d9;
      --red: #f85149;
      --green: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar { width: 256px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px; gap: 10px; flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 10px; padding: 6px 2px 10px; font-size: 17px; font-weight: 600; border-bottom: 1px solid var(--border); }
    .logo-mark { width: 30px; height: 30px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .new-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background .15s; }
    .new-btn:hover { background: var(--accent-h); }
    .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 0 2px; }
    select { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer; outline: none; }
    select:focus { border-color: var(--accent); }
    .history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .hist-item { padding: 7px 10px; border-radius: 6px; font-size: 12px; color: var(--dim); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .12s, color .12s; }
    .hist-item:hover, .hist-item.active { background: var(--surface); color: var(--text); }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; overflow-y: auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 22px; }

    /* ── Welcome ── */
    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 40px; }
    .welcome-icon { font-size: 52px; }
    .welcome h2 { font-size: 22px; }
    .welcome p { font-size: 14px; color: var(--dim); }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
    .sug { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 7px 16px; font-size: 12px; cursor: pointer; transition: border-color .15s; }
    .sug:hover { border-color: var(--accent); }

    /* ── Message rows ── */
    .msg { display: flex; gap: 11px; max-width: 780px; width: 100%; margin: 0 auto; }
    .msg.user { flex-direction: row-reverse; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    .msg.user .avatar { background: var(--accent); }
    .msg.assistant .avatar { background: var(--surface2); }
    .bubble { padding: 11px 15px; border-radius: 16px; max-width: calc(100% - 42px); font-size: 14.5px; line-height: 1.65; }
    .msg.user .bubble { background: linear-gradient(135deg, #7c3aed, #4f46e5); border-radius: 16px 4px 16px 16px; white-space: pre-wrap; word-break: break-word; }
    .msg.assistant .bubble { background: var(--surface); border-radius: 4px 16px 16px 16px; }
    .bubble p { margin-bottom: 8px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble li { margin: 3px 0; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 10px 0 6px; font-weight: 600; }
    .bubble h1 { font-size: 1.2em; } .bubble h2 { font-size: 1.1em; } .bubble h3, .bubble h4 { font-size: 1em; }
    .bubble code { background: var(--surface2); padding: 2px 5px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; }
    .bubble pre { background: #0d1117; border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    .bubble pre code { background: none; padding: 0; }
    .bubble a { color: #818cf8; } .bubble a:hover { text-decoration: underline; }
    .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
    .bubble th { background: var(--surface2); }
    .bubble blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--dim); margin: 6px 0; }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    /* ── Tool usage ── */
    .tool-card { background: var(--surface2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 9px 13px; margin-bottom: 8px; font-size: 13px; }
    .tool-head { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
    .tool-name { flex: 1; color: var(--dim); font-weight: 500; }
    .tool-chevron { color: var(--dim); font-size: 11px; transition: transform .2s; }
    .tool-body { display: none; margin-top: 8px; }
    .tool-body.open { display: block; }
    .tool-result { background: var(--bg); border-radius: 6px; padding: 8px 10px; font-size: 12px; max-height: 180px; overflow-y: auto; white-space: pre-wrap; color: var(--dim); font-family: 'SF Mono', 'Fira Code', monospace; line-height: 1.5; }

    /* ── Typing dots ── */
    .typing { display: flex; gap: 5px; padding: 12px 16px; background: var(--surface); border-radius: 4px 16px 16px 16px; }
    .dot { width: 7px; height: 7px; background: var(--dim); border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }

    /* ── Error ── */
    .err-bubble { background: #2d1b1b; border: 1px solid var(--red); border-radius: 10px; padding: 11px 15px; color: var(--red); font-size: 14px; }

    /* ── Input ── */
    .input-area { padding: 14px 24px 18px; border-top: 1px solid var(--border); }
    .input-wrap { max-width: 780px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: flex-end; padding: 9px 12px; gap: 9px; transition: border-color .15s; }
    .input-wrap:focus-within { border-color: var(--accent); }
    textarea { flex: 1; background: none; border: none; color: var(--text); font-size: 14.5px; font-family: inherit; resize: none; outline: none; max-height: 180px; line-height: 1.55; }
    textarea::placeholder { color: var(--dim); }
    .send-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s, opacity .15s; }
    .send-btn:hover { background: var(--accent-h); }
    .send-btn:disabled { opacity: .35; cursor: not-allowed; }
    .hint { text-align: center; font-size: 11px; color: var(--dim); margin-top: 7px; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 580px) { .sidebar { display: none; } }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">✦</div>
    AI Chat
  </div>

  <button class="new-btn" onclick="newChat()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New Chat
  </button>

  <div class="section-label">Model</div>
  <select id="modelSelect"></select>

  <div class="section-label">History</div>
  <div class="history" id="historyList"></div>
</aside>

<main class="main">
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" placeholder="Message AI… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <p class="hint">AI can make mistakes — verify important information.</p>
  </div>
</main>

<script>
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight(code, lang) {
    if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    return hljs.highlightAuto(code).value;
  }
});

// ── State ──────────────────────────────────────────────────
let apiMessages = [];
let displayMessages = [];
let isLoading = false;
let currentHistoryId = null;
let histories = [];
try { histories = JSON.parse(localStorage.getItem('ai-chat-v1') || '[]'); } catch(_) {}

// ── Init ───────────────────────────────────────────────────
(async () => {
  try {
    const res = await fetch('/api/models');
    const data = await res.json();
    const sel = document.getElementById('modelSelect');
    data.models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id; opt.textContent = m.name;
      sel.appendChild(opt);
    });
  } catch(_) {}
  showWelcome();
  renderSidebar();
})();

// ── Textarea auto-resize ───────────────────────────────────
const ta = document.getElementById('input');
ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; });
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

// ── Suggestions ────────────────────────────────────────────
function suggest(text) { ta.value = text; ta.dispatchEvent(new Event('input')); sendMessage(); }

// ── Welcome screen ─────────────────────────────────────────
function showWelcome() {
  const c = document.getElementById('messages');
  c.innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">✦</div>
      <h2>What can I help with?</h2>
      <p>Ask me anything. I can search the web for current information.</p>
      <div class="suggestions">
        <div class="sug" onclick="suggest('What is the latest news in AI today?')">Latest AI news</div>
        <div class="sug" onclick="suggest('What is the current Bitcoin price?')">Bitcoin price</div>
        <div class="sug" onclick="suggest('Best Python web frameworks in 2025')">Python frameworks</div>
        <div class="sug" onclick="suggest('What happened in tech today?')">Tech news today</div>
      </div>
    </div>`;
}

// ── New chat ────────────────────────────────────────────────
function newChat() {
  apiMessages = []; displayMessages = []; currentHistoryId = null;
  showWelcome(); renderSidebar();
  ta.value = ''; ta.style.height = 'auto'; ta.focus();
}

// ── Sidebar ─────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  [...histories].reverse().forEach(h => {
    const d = document.createElement('div');
    d.className = 'hist-item' + (h.id === currentHistoryId ? ' active' : '');
    d.textContent = h.title;
    d.onclick = () => loadHistory(h.id);
    list.appendChild(d);
  });
}

function saveHistory() {
  const firstUser = displayMessages.find(m => m.role === 'user');
  const title = firstUser ? firstUser.content.slice(0, 50) : 'New Chat';
  if (currentHistoryId) {
    const h = histories.find(x => x.id === currentHistoryId);
    if (h) { h.apiMessages = [...apiMessages]; h.displayMessages = [...displayMessages]; }
  } else {
    currentHistoryId = Date.now().toString();
    histories.push({ id: currentHistoryId, title, apiMessages: [...apiMessages], displayMessages: [...displayMessages] });
    histories = histories.slice(-60);
  }
  try { localStorage.setItem('ai-chat-v1', JSON.stringify(histories)); } catch(_) {}
  renderSidebar();
}

function loadHistory(id) {
  const h = histories.find(x => x.id === id);
  if (!h) return;
  currentHistoryId = id;
  apiMessages = [...h.apiMessages];
  displayMessages = [...h.displayMessages];
  const c = document.getElementById('messages');
  c.innerHTML = '';
  displayMessages.forEach(m => {
    if (m.role === 'user') appendUserBubble(m.content);
    else appendAssistantBubble(m.content, m.tools);
  });
  renderSidebar();
}

// ── Render helpers ──────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function appendUserBubble(text) {
  const c = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="avatar">👤</div><div class="bubble">${esc(text)}</div>`;
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

function appendAssistantBubble(content, tools) {
  const c = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg assistant';

  let toolsHtml = '';
  if (tools && tools.length) {
    toolsHtml = tools.map((t, i) => {
      const icon = t.name === 'web_search' ? '🔍' : '🌐';
      const label = t.name === 'web_search'
        ? `Searched: ${esc(t.args.query || '')}`
        : `Fetched: ${esc(t.args.url || '')}`;
      return `
        <div class="tool-card">
          <div class="tool-head" onclick="toggleTool(this)">
            <span>${icon}</span>
            <span class="tool-name">${label}</span>
            <span class="tool-chevron">▼</span>
          </div>
          <div class="tool-body">
            <div class="tool-result">${esc(t.result)}</div>
          </div>
        </div>`;
    }).join('');
  }

  el.innerHTML = `
    <div class="avatar">✦</div>
    <div>
      ${toolsHtml}
      <div class="bubble">${marked.parse(content || '')}</div>
    </div>`;
  c.appendChild(el);
  el.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
  c.scrollTop = c.scrollHeight;
}

function appendTypingIndicator() {
  const c = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg assistant'; el.id = 'typing';
  el.innerHTML = `<div class="avatar">✦</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

function removeTypingIndicator() { document.getElementById('typing')?.remove(); }

function appendErrorBubble(msg) {
  const c = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.innerHTML = `<div class="avatar">✦</div><div class="err-bubble">⚠️ ${esc(msg)}</div>`;
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

function toggleTool(head) {
  const body = head.nextElementSibling;
  const chevron = head.querySelector('.tool-chevron');
  body.classList.toggle('open');
  chevron.style.transform = body.classList.contains('open') ? 'rotate(180deg)' : '';
}

// ── Send ────────────────────────────────────────────────────
async function sendMessage() {
  if (isLoading) return;
  const text = ta.value.trim();
  if (!text) return;

  ta.value = ''; ta.style.height = 'auto';
  const model = document.getElementById('modelSelect').value;

  apiMessages.push({ role: 'user', content: text });
  displayMessages.push({ role: 'user', content: text });
  appendUserBubble(text);

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  appendTypingIndicator();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: apiMessages.slice(), model })
    });

    removeTypingIndicator();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Server error ${res.status}`);
    }

    const data = await res.json();
    if (data.error) throw new Error(data.error);

    apiMessages = data.messages;
    displayMessages.push({ role: 'assistant', content: data.content, tools: data.tool_calls });
    appendAssistantBubble(data.content, data.tool_calls);
    saveHistory();

  } catch (err) {
    removeTypingIndicator();
    appendErrorBubble(err.message || 'Something went wrong. Please try again.');
    // Roll back optimistic user message
    apiMessages.pop(); displayMessages.pop();
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    ta.focus();
  }
}
</script>
</body>
</html>
